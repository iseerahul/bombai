# Bambai, self-hosted.
#
#   docker compose up --build      →  http://localhost:8787
#
# The landing is at /, the map at /app/, the API at /api/*, all from this one
# container — the same single-origin layout as the Cloudflare deployment, which
# is what keeps "Explore Bambai" a plain same-origin link.

services:
  bambai:
    build: .
    image: bambai:local
    ports:
      # host:container. Everything is on 8787 inside — the landing at /, the
      # map at /app/, the API at /api/*. To serve it on another host port,
      # change only the left number (e.g. "3000:8787") and open THAT port in
      # your firewall or cloud security group.
      - "8787:8787"
    environment:
      # Where the browser thinks it is. Google's OAuth redirect is built from
      # this, so it must match the URL you actually open AND the Authorised
      # redirect URI registered in Google Cloud, or sign-in fails with
      # redirect_uri_mismatch. Behind a reverse proxy, set your public https URL.
      # On a public host this MUST be the URL people actually type. Left at a
      # localhost value on an internet-facing box it switches on the dev
      # sign-in shortcut — anyone could become any user. The server switches
      # that shortcut off automatically for any non-loopback bind, but
      # APP_ORIGIN still has to be right for OAuth and cookie flags to work.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8787}

      # Salts the rate-limit hash. Any long random string; changing it just
      # resets the buckets. Generate one with:  openssl rand -hex 32
      IP_SALT: ${IP_SALT:?set IP_SALT in .env or the environment}

      # Optional. Leave both unset and the Worker enables its local dev login
      # instead — fine for a demo, never for anything reachable from outside.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # The dev sign-in shortcut is OFF in a container, always, because a
      # container is reachable from outside itself and the shortcut lets anyone
      # become any user. Set this to 1 only on a trusted private network where
      # you want the shortcut back.
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-}

      # Walking, cycling and driving directions. Without it /api/route returns
      # 503 and the client quietly falls back to straight lines with guessed
      # times — no error, just worse answers. Free key, no card:
      # https://openrouteservice.org/dev/#/signup
      ORS_API_KEY: ${ORS_API_KEY:-}

      # A third event source. Without it that importer reports not_configured
      # and the other sources still run.
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}

    volumes:
      # Everything that must outlive the container: the SQLite database and
      # every uploaded photo. Without this, `docker compose down` deletes every
      # account, pin and picture.
      - bambai-data:/data

    restart: unless-stopped

    # The Worker answers this without touching the database, so it reports the
    # process being up rather than the database being reachable.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  bambai-data:
